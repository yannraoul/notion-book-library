# Unsigned iOS build for sideloading. Install + keep the 7-day cert
# refreshed with SideStore — see docs/ios-sideload.md.
workflows:
  ios-unsigned:
    name: iOS unsigned (SideStore)
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build unsigned app
        script: flutter build ios --release --no-codesign
      - name: Package as IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Shelf.ipa Payload
    artifacts:
      - Shelf.ipa
